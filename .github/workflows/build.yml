name: Build GLITCH//CORE ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libelf-dev libssl-dev \
            libncurses-dev cpio xz-utils wget ca-certificates xorriso grub-pc-bin grub-common

      - name: Build bootable prototype
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: glitch-core-iso
          path: dist/GLITCH-CORE.iso
          if-no-files-found: error
          retention-days: 7
