name: GLITCH//CORE — LFS toolchain Pass 1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glitch-core-lfs-toolchain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lfs-toolchain-pass1:
    name: Build Binutils + GCC Pass 1 (LFS 13.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      LFS: ${{ github.workspace }}/work-lfs/lfs
      LFS_TGT: x86_64-lfs-linux-gnu
      JOBS: "2"

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Show runner resources
        run: |
          echo "Runner: $RUNNER_OS / $ImageOS"
          echo "CPU cores: $(nproc)"
          free -h
          df -h "$GITHUB_WORKSPACE"

      - name: Install LFS host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison gawk m4 texinfo perl python3 \
            patch diffutils findutils grep sed \
            file gzip xz-utils wget ca-certificates

      - name: Run read-only host preflight
        run: |
          bash scripts/lfs/check-host.sh

      - name: Download and verify official LFS 13.1 sources
        run: |
          chmod +x scripts/build-lfs.sh
          ./scripts/build-lfs.sh

      - name: Prepare isolated LFS tools directory
        run: |
          mkdir -p "$LFS/tools"
          test -w "$LFS/tools"
          test -s "$LFS/sources/md5sums"
          echo "LFS=$LFS"
          echo "LFS_TGT=$LFS_TGT"

      - name: Build Binutils Pass 1 and GCC Pass 1
        run: |
          chmod +x scripts/lfs/build-toolchain-pass1.sh
          bash scripts/lfs/build-toolchain-pass1.sh all

      - name: Verify cross-toolchain outputs
        run: |
          "$LFS/tools/bin/$LFS_TGT-ld" --version
          "$LFS/tools/bin/$LFS_TGT-gcc" -dumpmachine
          test -f "$LFS/tools/.glitchcore-binutils-pass1-complete"
          test -f "$LFS/tools/.glitchcore-gcc-pass1-complete"

      - name: Upload LFS Pass 1 checkpoint
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: glitch-core-lfs-toolchain-pass1
          path: |
            work-lfs/LFS-VERSION
            work-lfs/lfs/sources/
            work-lfs/lfs/tools/
          if-no-files-found: error
          retention-days: 7
