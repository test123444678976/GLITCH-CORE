name: Build GLITCH//CORE ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc bison flex \
            libelf-dev libssl-dev libncurses-dev \
            cpio xz-utils wget curl ca-certificates \
            xorriso mtools grub-pc-bin grub-common \
            gawk texinfo python3 python3-pip \
            perl rsync git pkg-config \
            meson ninja-build gettext \
            autoconf automake libtool \
            gperf autopoint \
            docbook-xsl xsltproc \
            file patch unzip

      - name: Build GLITCH//CORE
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: glitch-core-iso
          path: dist/GLITCH-CORE.iso
          if-no-files-found: error
          retention-days: 7
