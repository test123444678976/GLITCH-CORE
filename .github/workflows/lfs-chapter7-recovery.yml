name: GLITCH//CORE LFS Chapter 7 Recovery

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Chapter 6 workflow run containing the checkpoint artifact"
        required: true
        default: "45016697312"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: glitchcore-lfs-chapter7-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild-chapter7:
    name: Resume from Chapter 6 and build Chapter 7
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LFS: ${{ github.workspace }}/work-lfs/lfs
      LFS_TGT: x86_64-lfs-linux-gnu
      JOBS: "2"
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Download verified Chapter 6 checkpoint from prior run
        uses: actions/download-artifact@v4
        with:
          name: glitch-core-lfs-toolchain-chapter6-x86_64
          path: work-lfs
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Restore Chapter 6 checkpoint
        run: |
          set -Eeuo pipefail
          archive=work-lfs/glitch-core-lfs-toolchain-chapter6-x86_64.tar.gz
          test -s "$archive"
          tar -tzf "$archive" >/dev/null
          tar -xzf "$archive" -C work-lfs
          test -f "$LFS/tools/.glitchcore-chapter6-complete"
          test -x "$LFS/usr/bin/bash"
          test -s "$LFS/sources/Python-3.14.7.tar.xz"

      - name: Test and prepare Chapter 7 chroot
        run: |
          set -Eeuo pipefail
          sudo bash scripts/lfs/test-chroot-rootfs.sh
          sudo bash scripts/lfs/prepare-chroot-rootfs.sh "$LFS"
          grep -Fxq "LFS_BOOK=13.1-systemd" "$LFS/CHAPTER-7-CHROOT-PREP-INFO.txt"
          grep -Fxq "CHROOT_SMOKE=passed" "$LFS/CHAPTER-7-CHROOT-PREP-INFO.txt"

      - name: Run Chapter 7 builder regression tests and preflight
        run: |
          set -Eeuo pipefail
          bash scripts/lfs/test-toolchain-chapter7.sh
          bash scripts/lfs/build-toolchain-chapter7.sh --check-only "$LFS"

      - name: Build all eight Chapter 7 temporary packages
        run: sudo --preserve-env=JOBS,GITHUB_SHA,GITHUB_REF_NAME,GITHUB_RUN_ID bash scripts/lfs/build-toolchain-chapter7.sh "$LFS"

      - name: Verify Chapter 7 tools inside the target rootfs
        run: |
          set -Eeuo pipefail
          test -f "$LFS/tools/.glitchcore-chapter7-temporary-tools-complete"
          for package in gettext bison perl zlib mpdecimal python texinfo util-linux; do
            test -f "$LFS/tools/.glitchcore-ch7-$package-complete"
          done
          test -s "$LFS/CHAPTER-7-BUILD-INFO.txt"
          grep -Fq "Status: all eight temporary packages built and verified" "$LFS/CHAPTER-7-BUILD-INFO.txt"
          test -s "$LFS/usr/lib/libpython3.14.so.1.0"
          sudo chroot "$LFS" /usr/bin/env -i PATH=/usr/bin:/usr/sbin /bin/bash -c '
            set -Eeuo pipefail
            /usr/bin/python3 --version
            /usr/bin/bison --version | /usr/bin/head -n 1
            /usr/bin/makeinfo --version | /usr/bin/head -n 1
            /usr/bin/mount --version | /usr/bin/head -n 1
          '

      - name: Package completed Chapter 7 checkpoint
        run: |
          set -Eeuo pipefail
          archive="$GITHUB_WORKSPACE/work-lfs/glitch-core-lfs-toolchain-chapter7-x86_64.tar.gz"
          sudo bash scripts/lfs/package-chroot-checkpoint.sh \
            "$GITHUB_WORKSPACE/work-lfs" "$archive" "$(id -u)" "$(id -g)"
          tar -tzf "$archive" >/dev/null
          tar -tzf "$archive" | grep -Fxq "lfs/CHAPTER-7-BUILD-INFO.txt"
          test -s "$archive"

      - name: Upload Chapter 7 temporary-tools checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: glitch-core-lfs-toolchain-chapter7-x86_64
          path: work-lfs/glitch-core-lfs-toolchain-chapter7-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
