name: GLITCH//CORE LFS Chapter 8.10 Zstd
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Chapter 8.9 LZ4 run containing the checkpoint artifact"
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: glitchcore-lfs-chapter8-zstd
  cancel-in-progress: false
jobs:
  build-zstd:
    name: Restore Chapter 8.9 and build Zstd 1.5.7
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LFS: ${{ github.workspace }}/work-lfs/lfs
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/mate-desktop
      - name: Download Chapter 8.9 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: glitch-core-lfs-chapter8-lz4-x86_64
          path: work-lfs
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Restore and verify Chapter 8.9
        run: |
          set -Eeuo pipefail
          archive=work-lfs/glitch-core-lfs-chapter8-lz4-x86_64.tar.gz
          test -s "$archive"
          tar -tzf "$archive" >/dev/null
          tar -xzf "$archive" -C work-lfs
          for marker in .glitchcore-chapter7-temporary-tools-complete .glitchcore-ch8-man-pages-complete .glitchcore-ch8-iana-etc-complete .glitchcore-ch8-glibc-complete .glitchcore-ch8-zlib-complete .glitchcore-ch8-bzip2-complete .glitchcore-ch8-xz-complete .glitchcore-ch8-lz4-complete; do
            test -f "$LFS/tools/$marker"
          done
          grep -Fq "Status: LZ4 1.10.0 built, make -j1 check passed, installed and smoke-tested inside LFS chroot" "$LFS/CHAPTER-8-BUILD-INFO.txt"
          test -s "$LFS/sources/md5sums"
      - name: Test and preflight Zstd
        run: |
          set -Eeuo pipefail
          bash scripts/lfs/test-chapter8-zstd.sh
          sudo bash scripts/lfs/build-chapter8-zstd.sh --check-only "$LFS"
      - name: Build and test Zstd 1.5.7 inside LFS
        run: sudo bash scripts/lfs/build-chapter8-zstd.sh "$LFS"
      - name: Verify Zstd installation
        run: |
          set -Eeuo pipefail
          test -f "$LFS/tools/.glitchcore-ch8-zstd-complete"
          test -x "$LFS/usr/bin/zstd"
          test -s "$LFS/usr/lib/libzstd.so"
          test ! -e "$LFS/usr/lib/libzstd.a"
          for app in zstdcat zstdmt unzstd; do test -L "$LFS/usr/bin/$app"; done
          test -x "$LFS/usr/bin/zstdgrep"
          test -x "$LFS/usr/bin/zstdless"
          grep -Fq "Status: Zstd 1.5.7 built, make check passed, installed and smoke-tested inside LFS chroot" "$LFS/CHAPTER-8-BUILD-INFO.txt"
      - name: Package Chapter 8.10 checkpoint
        run: |
          set -Eeuo pipefail
          archive="$GITHUB_WORKSPACE/work-lfs/glitch-core-lfs-chapter8-zstd-x86_64.tar.gz"
          sudo bash scripts/lfs/package-chapter8-checkpoint.sh "$GITHUB_WORKSPACE/work-lfs" "$archive" "$(id -u)" "$(id -g)" ".glitchcore-ch8-zstd-complete"
          test -s "$archive"
          tar -tzf "$archive" | grep -Fxq "lfs/tools/.glitchcore-ch8-zstd-complete"
      - name: Upload Chapter 8.10 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: glitch-core-lfs-chapter8-zstd-x86_64
          path: work-lfs/glitch-core-lfs-chapter8-zstd-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
