name: GLITCH//CORE LFS Chapter 8.4 IANA-etc

on:
  push:
    branches: [ feature/mate-desktop ]
    paths:
      - "docs/CHAPTER8-IANA-TRIGGER.md"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Chapter 8.3 run containing the Man-pages checkpoint artifact"
        required: true
        default: "45586451667"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: glitchcore-lfs-chapter8-iana-etc
  cancel-in-progress: false

jobs:
  build-iana-etc:
    name: Restore Chapter 8.3 and install IANA-etc 20260805
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LFS: ${{ github.workspace }}/work-lfs/lfs
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/mate-desktop

      - name: Download Chapter 8.3 Man-pages checkpoint
        uses: actions/download-artifact@v4
        with:
          name: glitch-core-lfs-chapter8-man-pages-x86_64
          path: work-lfs
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || '45586451667' }}

      - name: Restore and verify Chapter 8.3
        run: |
          set -Eeuo pipefail
          archive=work-lfs/glitch-core-lfs-chapter8-man-pages-x86_64.tar.gz
          test -s "$archive"
          tar -tzf "$archive" >/dev/null
          tar -xzf "$archive" -C work-lfs
          test -f "$LFS/tools/.glitchcore-chapter7-temporary-tools-complete"
          test -f "$LFS/tools/.glitchcore-ch8-man-pages-complete"
          test -s "$LFS/CHAPTER-8-BUILD-INFO.txt"
          grep -Fq "Status: Man-pages 6.18 installed and verified inside LFS chroot" "$LFS/CHAPTER-8-BUILD-INFO.txt"
          test -s "$LFS/sources/md5sums"

      - name: Test and preflight Chapter 8.4
        run: |
          set -Eeuo pipefail
          sudo bash scripts/lfs/test-chapter8-iana-etc.sh
          sudo bash scripts/lfs/build-chapter8-iana-etc.sh --check-only "$LFS"

      - name: Install IANA-etc 20260805 into LFS
        run: sudo bash scripts/lfs/build-chapter8-iana-etc.sh "$LFS"

      - name: Verify Chapter 8.4 installation
        run: |
          set -Eeuo pipefail
          test -f "$LFS/tools/.glitchcore-ch8-iana-etc-complete"
          test -s "$LFS/etc/services"
          test -s "$LFS/etc/protocols"
          cmp -s "$LFS/etc/services" <(tar -xOzf "$LFS/sources/iana-etc-20260805.tar.gz" iana-etc-20260805/services)
          cmp -s "$LFS/etc/protocols" <(tar -xOzf "$LFS/sources/iana-etc-20260805.tar.gz" iana-etc-20260805/protocols)

      - name: Package Chapter 8.4 checkpoint
        run: |
          set -Eeuo pipefail
          archive="$GITHUB_WORKSPACE/work-lfs/glitch-core-lfs-chapter8-iana-etc-x86_64.tar.gz"
          sudo bash scripts/lfs/package-chapter8-checkpoint.sh "$GITHUB_WORKSPACE/work-lfs" "$archive" "$(id -u)" "$(id -g)" ".glitchcore-ch8-iana-etc-complete"
          listing="$(mktemp)"
          trap 'rm -f "$listing"' EXIT
          tar -tzf "$archive" > "$listing"
          grep -Fxq "lfs/tools/.glitchcore-ch8-iana-etc-complete" "$listing"
          rm -f "$listing"
          trap - EXIT
          test -s "$archive"

      - name: Upload Chapter 8.4 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: glitch-core-lfs-chapter8-iana-etc-x86_64
          path: work-lfs/glitch-core-lfs-chapter8-iana-etc-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
