name: GLITCH//CORE LFS Chapter 8.9 LZ4
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Chapter 8.8 Xz run containing the checkpoint artifact"
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: glitchcore-lfs-chapter8-lz4
  cancel-in-progress: false
jobs:
  build-lz4:
    name: Restore Chapter 8.8 and build LZ4 1.10.0
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LFS: ${{ github.workspace }}/work-lfs/lfs
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/mate-desktop
      - name: Download Chapter 8.8 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: glitch-core-lfs-chapter8-xz-x86_64
          path: work-lfs
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Restore and verify Chapter 8.8
        run: |
          set -Eeuo pipefail
          archive=work-lfs/glitch-core-lfs-chapter8-xz-x86_64.tar.gz
          test -s "$archive"
          tar -tzf "$archive" >/dev/null
          tar -xzf "$archive" -C work-lfs
          for marker in .glitchcore-chapter7-temporary-tools-complete .glitchcore-ch8-man-pages-complete .glitchcore-ch8-iana-etc-complete .glitchcore-ch8-glibc-complete .glitchcore-ch8-zlib-complete .glitchcore-ch8-bzip2-complete .glitchcore-ch8-xz-complete; do
            test -f "$LFS/tools/$marker"
          done
          grep -Fq "Status: Xz 5.8.3 built, make check passed, installed and smoke-tested inside LFS chroot" "$LFS/CHAPTER-8-BUILD-INFO.txt"
          test -s "$LFS/sources/md5sums"
      - name: Test and preflight LZ4
        run: |
          set -Eeuo pipefail
          bash scripts/lfs/test-chapter8-lz4.sh
          sudo bash scripts/lfs/build-chapter8-lz4.sh --check-only "$LFS"
      - name: Build and test LZ4 1.10.0 inside LFS
        run: sudo bash scripts/lfs/build-chapter8-lz4.sh "$LFS"
      - name: Verify LZ4 installation
        run: |
          set -Eeuo pipefail
          test -f "$LFS/tools/.glitchcore-ch8-lz4-complete"
          test -x "$LFS/usr/bin/lz4"
          test -s "$LFS/usr/lib/liblz4.so"
          test ! -e "$LFS/usr/lib/liblz4.a"
          for app in lz4c lz4cat unlz4; do test -L "$LFS/usr/bin/$app"; done
          grep -Fq "Status: LZ4 1.10.0 built, make -j1 check passed, installed and smoke-tested inside LFS chroot" "$LFS/CHAPTER-8-BUILD-INFO.txt"
      - name: Package Chapter 8.9 checkpoint
        run: |
          set -Eeuo pipefail
          archive="$GITHUB_WORKSPACE/work-lfs/glitch-core-lfs-chapter8-lz4-x86_64.tar.gz"
          sudo bash scripts/lfs/package-chapter8-checkpoint.sh "$GITHUB_WORKSPACE/work-lfs" "$archive" "$(id -u)" "$(id -g)" ".glitchcore-ch8-lz4-complete"
          test -s "$archive"
          tar -tzf "$archive" | grep -Fxq "lfs/tools/.glitchcore-ch8-lz4-complete"
      - name: Upload Chapter 8.9 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: glitch-core-lfs-chapter8-lz4-x86_64
          path: work-lfs/glitch-core-lfs-chapter8-lz4-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
