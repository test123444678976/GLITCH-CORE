name: GLITCH//CORE LFS Chapter 8.8 Xz
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Chapter 8.7 Bzip2 run containing the checkpoint artifact"
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: glitchcore-lfs-chapter8-xz
  cancel-in-progress: false
jobs:
  build-xz:
    name: Restore Chapter 8.7 and build Xz 5.8.3
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LFS: ${{ github.workspace }}/work-lfs/lfs
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/mate-desktop
      - name: Download Chapter 8.7 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: glitch-core-lfs-chapter8-bzip2-x86_64
          path: work-lfs
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Restore and verify Chapter 8.7
        run: |
          set -Eeuo pipefail
          archive=work-lfs/glitch-core-lfs-chapter8-bzip2-x86_64.tar.gz
          test -s "$archive"
          tar -tzf "$archive" >/dev/null
          tar -xzf "$archive" -C work-lfs
          for marker in .glitchcore-chapter7-temporary-tools-complete .glitchcore-ch8-man-pages-complete .glitchcore-ch8-iana-etc-complete .glitchcore-ch8-glibc-complete .glitchcore-ch8-zlib-complete .glitchcore-ch8-bzip2-complete; do
            test -f "$LFS/tools/$marker"
          done
          grep -Fq "Status: Bzip2 1.0.8 built, smoke-tested and installed inside LFS chroot" "$LFS/CHAPTER-8-BUILD-INFO.txt"
          test -s "$LFS/sources/md5sums"
      - name: Test and preflight Xz
        run: |
          set -Eeuo pipefail
          bash scripts/lfs/test-chapter8-xz.sh
          sudo bash scripts/lfs/build-chapter8-xz.sh --check-only "$LFS"
      - name: Build and test Xz 5.8.3 inside LFS
        run: sudo bash scripts/lfs/build-chapter8-xz.sh "$LFS"
      - name: Verify Xz installation
        run: |
          set -Eeuo pipefail
          test -f "$LFS/tools/.glitchcore-ch8-xz-complete"
          test -x "$LFS/usr/bin/xz"
          test -x "$LFS/usr/bin/xzdec"
          test -s "$LFS/usr/lib/liblzma.so"
          test ! -e "$LFS/usr/lib/liblzma.a"
          test -s "$LFS/usr/include/lzma.h"
          test -d "$LFS/usr/share/doc/xz-5.8.3"
          grep -Fq "Status: Xz 5.8.3 built, make check passed, installed and smoke-tested inside LFS chroot" "$LFS/CHAPTER-8-BUILD-INFO.txt"
      - name: Package Chapter 8.8 checkpoint
        run: |
          set -Eeuo pipefail
          archive="$GITHUB_WORKSPACE/work-lfs/glitch-core-lfs-chapter8-xz-x86_64.tar.gz"
          sudo bash scripts/lfs/package-chapter8-checkpoint.sh "$GITHUB_WORKSPACE/work-lfs" "$archive" "$(id -u)" "$(id -g)" ".glitchcore-ch8-xz-complete"
          test -s "$archive"
          tar -tzf "$archive" | grep -Fxq "lfs/tools/.glitchcore-ch8-xz-complete"
      - name: Upload Chapter 8.8 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: glitch-core-lfs-chapter8-xz-x86_64
          path: work-lfs/glitch-core-lfs-chapter8-xz-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
