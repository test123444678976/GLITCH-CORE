name: Build GLITCH//CORE ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/mate-desktop ]
  pull_request:
    branches: [ main, feature/mate-desktop ]

permissions:
  contents: read

jobs:
  validate-project:
    name: Validate MATE, package manager and shell scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Check shell script syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            bash -n "$file"
          done

      - name: Validate MATE desktop configuration
        run: |
          chmod +x scripts/lfs/*.sh
          bash scripts/lfs/test-mate-config.sh
          bash scripts/lfs/test-mate-target.sh
          bash scripts/lfs/test-graphics-stack.sh
          bash scripts/lfs/test-graphics-target.sh
          bash scripts/lfs/test-graphics-sources.sh
          bash scripts/lfs/test-xorgproto-build.sh
          bash scripts/lfs/test-xtrans-build.sh
          bash scripts/lfs/test-package-manager-build.sh
          bash scripts/lfs/test-package-manager-config.sh
          bash scripts/lfs/test-toolchain-pass1.sh

      - name: Validate GLITCH application SDK
        run: |
          python3 scripts/glitch-sdk/test-sdk.py
          python3 scripts/glitch-sdk/glitch.py validate examples/apps/hello-world
          python3 -m py_compile examples/apps/settings/main.py
          python3 scripts/glitch-sdk/glitch.py validate examples/apps/settings
          python3 scripts/glitch-sdk/glitch.py pack examples/apps/settings --output "$RUNNER_TEMP/glitch-settings.gcpkg"
          python3 scripts/glitch-sdk/glitch.py inspect "$RUNNER_TEMP/glitch-settings.gcpkg"

      - name: Validate APT and dpkg integration plan
        run: |
          bash scripts/lfs/test-package-manager.sh
          bash scripts/lfs/test-package-manager-build.sh

  build:
    name: Build rescue ISO
    # Keep expensive kernel/BusyBox builds off pull requests and feature pushes.
    # Run them manually or after changes reach main.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc bison flex \
            libelf-dev libssl-dev libncurses-dev \
            cpio xz-utils wget curl ca-certificates \
            xorriso mtools grub-pc-bin grub-common \
            gawk texinfo python3 python3-pip \
            perl rsync git pkg-config \
            meson ninja-build gettext \
            autoconf automake libtool \
            gperf autopoint \
            docbook-xsl xsltproc \
            grub-efi-amd64-bin \
            file patch unzip

      - name: Build GLITCH//CORE rescue ISO
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh

      - name: Upload rescue ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: glitch-core-iso
          path: dist/GLITCH-CORE.iso
          if-no-files-found: error
          retention-days: 7

  prepare-lfs-sources:
    name: Prepare GLITCH//CORE LFS 13.1
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LFS host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison gawk perl python3 \
            patch diffutils findutils \
            file xz-utils wget ca-certificates

      - name: Download and verify LFS sources
        run: |
          chmod +x scripts/build-lfs.sh
          ./scripts/build-lfs.sh

      - name: Upload LFS sources
        uses: actions/upload-artifact@v4
        with:
          name: glitch-core-lfs-13.1-sources
          path: |
            work-lfs/lfs/sources/
            work-lfs/LFS-VERSION
          if-no-files-found: error
          retention-days: 7

  build-lfs-toolchain-pass1:
    name: Build GLITCH//CORE LFS toolchain Pass 1
    if: github.event_name == 'workflow_dispatch'
    needs: prepare-lfs-sources
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      LFS: ${{ github.workspace }}/work-lfs/lfs
      LFS_TGT: x86_64-lfs-linux-gnu
      JOBS: "2"

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Download verified LFS sources
        uses: actions/download-artifact@v4
        with:
          name: glitch-core-lfs-13.1-sources
          path: work-lfs

      - name: Show runner resources
        run: |
          echo "Runner: $RUNNER_OS / $ImageOS"
          echo "CPU cores: $(nproc)"
          free -h
          df -h "$GITHUB_WORKSPACE"

      - name: Install LFS host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison gawk m4 texinfo perl python3 \
            patch diffutils findutils grep sed \
            file gzip xz-utils wget ca-certificates

      - name: Run read-only host preflight
        run: |
          bash scripts/lfs/check-host.sh

      - name: Prepare isolated LFS tools directory
        run: |
          mkdir -p "$LFS/tools"
          test -w "$LFS/tools"
          test -s "$LFS/sources/md5sums"
          echo "LFS=$LFS"
          echo "LFS_TGT=$LFS_TGT"

      - name: Build Binutils Pass 1 and GCC Pass 1
        run: |
          chmod +x scripts/lfs/build-toolchain-pass1.sh
          bash scripts/lfs/build-toolchain-pass1.sh all

      - name: Verify cross-toolchain outputs
        run: |
          "$LFS/tools/bin/$LFS_TGT-ld" --version
          "$LFS/tools/bin/$LFS_TGT-gcc" -dumpmachine
          test -f "$LFS/tools/.glitchcore-binutils-pass1-complete"
          test -f "$LFS/tools/.glitchcore-gcc-pass1-complete"

      - name: Upload LFS Pass 1 checkpoint
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: glitch-core-lfs-toolchain-pass1
          path: |
            work-lfs/LFS-VERSION
            work-lfs/lfs/sources/
            work-lfs/lfs/tools/
          if-no-files-found: error
          retention-days: 7

  desktop-build-host-preflight:
    name: Preflight host for Xorg, Mesa, GTK and MATE
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feature/mate-desktop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Install graphical desktop build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ make binutils \
            meson ninja-build cmake pkg-config \
            python3 perl autoconf automake libtool m4 \
            bison flex gettext gawk patch diffutils \
            file xz-utils bzip2 gzip texinfo \
            curl wget git rsync ccache \
            xsltproc docbook-xsl gperf autopoint \
            intltool xorriso mtools grub-common

      - name: Check shell syntax
        run: bash -n scripts/lfs/check-desktop-build-host.sh

      - name: Run read-only graphical desktop host preflight
        run: bash scripts/lfs/check-desktop-build-host.sh

  build-xorgproto:
    name: Build pinned X.Org protocol headers
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feature/mate-desktop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Install xorgproto build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl meson ninja-build python3

      - name: Download only the pinned xorgproto source
        run: |
          chmod +x scripts/lfs/fetch-graphics-sources.sh
          bash scripts/lfs/fetch-graphics-sources.sh \
            config/graphics-sources.lock \
            "$GITHUB_WORKSPACE/work-lfs/graphics-sources" \
            xorgproto

      - name: Compile and stage xorgproto
        run: |
          chmod +x scripts/lfs/build-xorgproto.sh
          bash scripts/lfs/build-xorgproto.sh

      - name: Upload xorgproto staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: glitch-core-xorgproto-x86_64
          path: work-lfs/graphics-stage/xorgproto/
          if-no-files-found: error
          retention-days: 14

  build-xtrans:
    name: Build pinned X.Org xtrans transport headers
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feature/mate-desktop'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Install xtrans build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl

      - name: Download only the pinned xtrans source
        run: |
          chmod +x scripts/lfs/*.sh
          bash scripts/lfs/fetch-graphics-sources.sh \
            config/graphics-sources.lock \
            "$GITHUB_WORKSPACE/work-lfs/graphics-sources" \
            xtrans

      - name: Compile and stage xtrans
        run: bash scripts/lfs/build-xtrans.sh

      - name: Upload xtrans staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: glitch-core-xtrans-x86_64
          path: work-lfs/graphics-stage/xtrans/
          if-no-files-found: error
          retention-days: 14

  native-package-manager-build:
    name: Compile native dpkg and APT source packages
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feature/mate-desktop'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      JOBS: "2"
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Install native package-manager build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool gettext \
            cmake ninja-build pkg-config curl xz-utils \
            libbz2-dev liblzma-dev libzstd-dev libselinux1-dev libmd-dev \
            libdb-dev libcurl4-openssl-dev libgnutls28-dev libgcrypt20-dev \
            liblz4-dev zlib1g-dev libxxhash-dev libseccomp-dev libsystemd-dev \
            libudev-dev libssl-dev triehash

      - name: Download and verify dpkg and APT sources
        run: |
          chmod +x scripts/lfs/*.sh
          bash scripts/lfs/fetch-package-manager-sources.sh \
            config/package-manager-sources.lock \
            "$GITHUB_WORKSPACE/work-lfs/package-manager-sources"

      - name: Compile and stage dpkg
        run: |
          bash scripts/lfs/build-dpkg.sh

      - name: Compile and stage APT
        run: |
          bash scripts/lfs/build-apt.sh

      - name: Audit staged native executables and provenance
        run: |
          chmod +x scripts/lfs/test-package-manager-stage.sh
          bash scripts/lfs/test-package-manager-stage.sh

      - name: Package native dpkg and APT staging trees
        run: |
          tar -C work-lfs/package-manager-stage -czf work-lfs/glitch-core-native-dpkg-apt-x86_64.tar.gz dpkg apt
          test -s work-lfs/glitch-core-native-dpkg-apt-x86_64.tar.gz

      - name: Upload native package-manager build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glitch-core-native-dpkg-apt-x86_64
          path: work-lfs/glitch-core-native-dpkg-apt-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-libdrm:
    name: Build pinned libdrm graphics foundation
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feature/mate-desktop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Install libdrm build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl meson ninja-build python3 libpciaccess-dev libudev-dev

      - name: Download only the pinned libdrm source
        run: |
          chmod +x scripts/lfs/*.sh
          bash scripts/lfs/fetch-graphics-sources.sh \
            config/graphics-sources.lock \
            "$GITHUB_WORKSPACE/work-lfs/graphics-sources" \
            libdrm

      - name: Compile and stage libdrm
        run: bash scripts/lfs/build-libdrm.sh

      - name: Upload libdrm staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: glitch-core-libdrm-x86_64
          path: work-lfs/graphics-stage/libdrm/
          if-no-files-found: error
          retention-days: 14

  collect-bootstrap-components:
    name: Collect verified desktop and package-manager build outputs
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feature/mate-desktop'
    needs:
      - validate-project
      - desktop-build-host-preflight
      - build-xorgproto
      - build-xtrans
      - native-package-manager-build
      - build-libdrm
    runs-on: ubuntu-24.04
    steps:
      - name: Download staged xorgproto headers
        uses: actions/download-artifact@v4
        with:
          name: glitch-core-xorgproto-x86_64
          path: work-lfs/desktop-stage/xorgproto

      - name: Download staged xtrans headers
        uses: actions/download-artifact@v4
        with:
          name: glitch-core-xtrans-x86_64
          path: work-lfs/desktop-stage/xtrans

      - name: Download staged libdrm graphics foundation
        uses: actions/download-artifact@v4
        with:
          name: glitch-core-libdrm-x86_64
          path: work-lfs/desktop-stage/libdrm

      - name: Download native dpkg and APT build archive
        uses: actions/download-artifact@v4
        with:
          name: glitch-core-native-dpkg-apt-x86_64
          path: work-lfs/package-manager

      - name: Create reproducibility manifest and component bundle
        run: |
          set -Eeuo pipefail
          test -d work-lfs/desktop-stage/xorgproto
          test -d work-lfs/desktop-stage/xtrans
          test -d work-lfs/desktop-stage/libdrm
          test -s work-lfs/package-manager/glitch-core-native-dpkg-apt-x86_64.tar.gz
          {
            echo "GLITCH//CORE staged component bundle"
            echo "Architecture: x86_64"
            echo "Branch: feature/mate-desktop"
            echo "Commit: $GITHUB_SHA"
            echo "Important: these are staging outputs, not an installed LFS rootfs."
            echo "The dpkg/APT binaries were compiled on the Ubuntu CI host."
          } > work-lfs/desktop-stage/BUILD-INFO.txt
          (
            cd work-lfs
            find desktop-stage package-manager -type f -print0 |
              sort -z |
              xargs -0 sha256sum
          ) > work-lfs/desktop-stage/SHA256SUMS
          tar -C work-lfs -czf work-lfs/glitch-core-bootstrap-components-x86_64.tar.gz \
            desktop-stage package-manager
          sha256sum work-lfs/glitch-core-bootstrap-components-x86_64.tar.gz

      - name: Upload combined bootstrap component bundle
        uses: actions/upload-artifact@v4
        with:
          name: glitch-core-bootstrap-components-x86_64
          path: work-lfs/glitch-core-bootstrap-components-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
